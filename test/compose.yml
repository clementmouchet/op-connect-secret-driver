services:
  test-service:
    image: alpine
    command: |
      sh -c "echo 'Echoing secrets:' && \
            echo Username: $$(cat /run/secrets/test_username) && \
            echo Password: $$(cat /run/secrets/test_password) && \
            echo section_password_by_attributes: $$(cat /run/secrets/test_section_password_by_attributes) && \
            echo section_password_by_ref: $$(cat /run/secrets/test_section_password_by_ref) && \
            echo config_yaml_by_attributes: $$(cat /run/secrets/test_config_yaml_by_attributes) && \
            echo config_yaml_by_ref: $$(cat /run/secrets/test_config_yaml_by_ref) && \
            echo test_special_field_uuid_by_attributes: $$(cat /run/secrets/test_special_field_uuid_by_attributes) && \
            echo test_special_field_uuid_by_ref: $$(cat /run/secrets/test_special_field_uuid_by_ref) && \
            echo 'All secrets echoed:' && \
            sleep infinity"
    secrets:
      - test_username
      - test_password
      - test_section_password_by_attributes
      - test_section_password_by_ref
      - test_config_yaml_by_attributes
      - test_config_yaml_by_ref
      - test_special_field_uuid_by_attributes
      - test_special_field_uuid_by_ref

secrets:
  test_username:
    driver: op-connect-secret-driver:latest
    labels:
      ref: "op://Test/Test Secret/username"

  test_password:
    driver: op-connect-secret-driver:latest
    labels:
      vault: "Test"
      item: "Test Secret"
      field: "password"

  test_section_password_by_attributes:
    driver: op-connect-secret-driver:latest
    labels:
      vault: "Test"
      item: "Test Secret"
      section: "section 1"
      field: "password"

  test_section_password_by_ref:
    driver: op-connect-secret-driver:latest
    labels:
      ref: "op://Test/Test Secret/section 1/password"

  test_config_yaml_by_attributes:
    driver: op-connect-secret-driver:latest
    labels:
      vault: "Test"
      item: "Test Config File"
      field: "config.yml"

  test_config_yaml_by_ref:
    driver: op-connect-secret-driver:latest
    labels:
      ref: "op://Test/Test Config File/config.yml"

  test_special_field_uuid_by_attributes:
    driver: op-connect-secret-driver:latest
    labels:
      vault: "Test"
      item: "buyrxgj6kdwulpomoudk3277pq"
      section: "qf65fxk4obzxwne6c3fithaliy"
      field: "2hht6727vkjyczjffo2hhflske"

  test_special_field_uuid_by_ref:
    driver: op-connect-secret-driver:latest
    labels:
      ref: "op://Test/buyrxgj6kdwulpomoudk3277pq/qf65fxk4obzxwne6c3fithaliy/2hht6727vkjyczjffo2hhflske"